<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="bootstrap.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <nav class="modern-nav">
      <div class="nav-content">
        <div class="nav-left">
          <div id="topleft" class="dimension-badge">
            <span class="badge-icon">📐</span>
            <span class="badge-text">Ready</span>
          </div>
        </div>
        
        <div class="nav-center">
          <span id="opened-file" class="file-path">
            Please open a file
          </span>
        </div>

        <div class="nav-right">
          <div class="app-logo">IMAGE</div>
        </div>
      </div>
    </nav>

    <main class="image-container">
      <div id="image" class="image-viewport">
        <!-- Image will be loaded here -->
      </div>
    </main>

    <!-- Zoom Controls -->
    <div id="zoom-controls" class="zoom-panel">
      <div class="zoom-header">
        <span class="zoom-title">Zoom</span>
        <span id="zoom-value" class="zoom-percentage">100%</span>
      </div>
      
      <div class="zoom-buttons">
        <button id="zoom-out" class="zoom-btn" title="Zoom Out">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 8H13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        
        <div class="zoom-slider-container">
          <input 
            type="range" 
            id="zoom-slider" 
            class="zoom-slider"
            min="10" 
            max="500" 
            value="100" 
            step="10"
          />
          <div class="slider-track"></div>
        </div>
        
        <button id="zoom-in" class="zoom-btn" title="Zoom In">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 3V13M3 8H13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="zoom-presets">
        <button class="preset-btn" data-zoom="50">50%</button>
        <button class="preset-btn" data-zoom="100">100%</button>
        <button class="preset-btn" data-zoom="200">200%</button>
        <button class="preset-btn active" data-zoom="fit">Fit</button>
      </div>
    </div>

    <style>
      @media print {
        nav, #zoom-controls {
          display: none !important;
        }
      }
    </style>
  </body>
</html>
